# Self-signed root CA for *.localhost (used by future HTTPS listeners).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-selfsigned-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: root-selfsigned-ca
  dnsNames:
    - "*.localhost"
    - "://localhost"
  subject:
    organizations:
      - MyOrg
    countries:
      - USA
  secretName: root-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: bootstrap-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
