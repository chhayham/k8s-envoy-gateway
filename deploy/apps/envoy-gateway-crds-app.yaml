# Envoy Gateway

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-crds
  namespace: argocd
spec:
  project: default
  source:
    helm:
      valuesObject:
        crds:
          envoyGateway:
            enabled: true	
          gatewayAPI:
            channel: "stable"	
            enabled: false    
    chart: gateway-crds-helm
    path: gateway-crds-helm
    repoURL: docker.io/envoyproxy
    targetRevision: v1.9.1
  destination:
    namespace: envoy
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
