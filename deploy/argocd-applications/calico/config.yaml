addon: 
  - name: calico
    chart: tigera-operator
    repoURL: https://docs.tigera.io/calico/charts
    targetRevision: v3.33.0
    namespace: tigera-operator
    helmValues: |
      installation:
        cni:
          type: Calico
        calicoNetwork:
          bgp: Disabled
          ipPools:
            - allowedUses:
                - Workload
                - Tunnel
              assignmentMode: Automatic
              blockSize: 26
              cidr: 10.244.0.0/16  # must stay within the minikube/kindnet platform pod network (node podCIDRs 10.244.x.0/24); tigera v3.33 rejects out-of-range CIDRs. kindnet-era legacy pods are covered by the IPIP route retarget in scripts/setup.sh
              disableBGPExport: false
              disableNewAllocations: false
              encapsulation: IPIP
              name: default-ipv4-ippool
              natOutgoing: Enabled
              nodeSelector: all()