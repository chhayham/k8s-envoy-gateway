apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
  source:
    chart: kube-prometheus-stack
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    targetRevision: 91.7.0
    helm:
      valuesObject:
        grafana:
          enabled: true
          adminPassword: admin
        #   resources:
        #     limits:
        #       cpu: 500m
        #       memory: 512Mi
        #     requests:
        #       cpu: 100m
        #       memory: 128Mi
        # prometheus:
        #   prometheusSpec:
        #     resources:
        #       limits:
        #         cpu: 1000m
        #         memory: 2Gi
        #     retention: 15d
        # alertmanager:
        #   resources:
        #     limits:
        #       cpu: 200m
        #       memory: 256Mi
        #     requests:
        #       cpu: 50m
        #       memory: 64Mi
  destination:
    namespace: kube-prometheus-stack
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
