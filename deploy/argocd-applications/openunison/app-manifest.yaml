# OpenUnison ArgoCD Application Manifest
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openunison
  namespace: argocd
  labels:
    app.kubernetes.io/name: openunison
spec:
  project: default
  source:
    chart: openunison-operator
    repoURL: https://nexus.tremolo.io/repository/helm
    targetRevision: "3.0.31"
    helm:
      releaseName: openunison
      valueFiles:
        - $values/deploy/argocd-applications/openunison/config.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openunison
  syncPolicy:
    automated:
      prune: true
      selfHeal: true