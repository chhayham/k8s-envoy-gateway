apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/chhayham/k8s-envoy-gateway
          revision: 2026-10-02-83df44 #main
          files:
          - path: deploy/argocd-applications/**/*config.yaml
      - list:
          elementsYaml: "{{ .addon | toJson }}"
  template:
    metadata:
      name: '{{.name}}'
      namespace: argocd
    spec:
      project: default
      source:
        chart: '{{.chart}}'
        repoURL: '{{.repoURL}}'
        targetRevision: '{{.targetRevision}}'
        helm:
          values: |
            {{.helmValues}}
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
--- 
# Todo: create helm chart for httproute?  Then it can be added to addons applicationset
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons-httproute
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/chhayham/k8s-envoy-gateway
        revision: 2026-10-02-83df44 #main
        files:
        - path: deploy/httproute/*
  template:
    metadata:
      name: '{{.path.basename}}-httproute'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/chhayham/k8s-envoy-gateway
        targetRevision: 2026-10-02-83df44 #main
        path: '{{.path.path}}'
      destination:
        namespace: '{{.path.basename}}'
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        automated:
          prune: true
          selfHeal: true
--- 
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons-resources
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/chhayham/k8s-envoy-gateway
        revision: 2026-10-02-83df44 #main
        files:
        - path: deploy/argocd-applications/*/resources/*.yaml
  template:
    metadata:
      name: '{{index .path.segments 2}}-resources'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/chhayham/k8s-envoy-gateway
        targetRevision: 2026-10-02-83df44 #main
        path: '{{.path.path}}'
      destination:
        namespace: '{{index .path.segments 2}}'
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          prune: true
          selfHeal: true
