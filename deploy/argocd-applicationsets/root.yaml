--- 
# Todo: create helm chart for httproute?  Then it can be added to addons applicationset
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons-httproute
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/chhayham/k8s-envoy-gateway
        revision: 2026-10-02-83df44 #main
        files:
        - path: deploy/httproute/*
  template:
    metadata:
      name: '{{.path.basename}}-httproute'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/chhayham/k8s-envoy-gateway
        targetRevision: 2026-10-02-83df44 #main
        path: '{{.path.path}}'
      destination:
        namespace: '{{.path.basename}}'
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        automated:
          prune: true
          selfHeal: true
