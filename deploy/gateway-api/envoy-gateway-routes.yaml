# Gateway API routes for Envoy Gateway
# These routes are managed by ArgoCD but defined here for completeness

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-gateway
  namespace: envoy
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy
      sectionName: http
  hostnames:
    - "envoy-gateway.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: envoy-gateway
          port: 80
          namespace: envoy
