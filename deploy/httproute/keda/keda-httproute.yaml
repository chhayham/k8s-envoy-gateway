apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keda
  namespace: keda
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy
      sectionName: http
  hostnames:
    - "keda.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keda-webhook
          port: 443
          namespace: keda
