---
# OpenUnison HTTPRoute for external access via k8sou.localhost
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openunison-orchestra
  namespace: openunison
spec:
  hostnames:
    - k8sou.localhost
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: openunison-orchestra
          port: 443
      matches:
        - path:
            type: PathPrefix
            value: /
---
# OpenUnison HTML Portal HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openunison-portal
  namespace: openunison
spec:
  hostnames:
    - k8sou.localhost
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: ouhtml-orchestra-login-portal
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
          