network:
  openunison_host: "k8sou.localhost"
  dashboard_host: "k8sdb.localhost"
  api_server_host: "k8sapi.localhost"
  session_inactivity_timeout_seconds: 900
  k8s_url: https://kubernetes.default.svc:6443
  force_redirect_to_tls: true
  createIngressCertificate: true
  ingress_type: gatewayapi
  ingress_annotations: {}
  host_aliases:
    - ip: "10.102.132.220"
      hostnames:
        - "k8sou.localhost"
  gatewayapi:
    class: envoy
    gateway:
      # disable the creation of the Gateway object
      create: false
      # specify the parent_refs for the web components of OpenUnison
      parent_refs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-gateway
        namespace: envoy-gateway-system
        sectionName: https
      # k8sou.localhost also attaches to the 'ou-https' listener, which
      # terminates TLS with ou-tls-certificate — the same certificate
      # kube-oidc-proxy uses as its OIDC CA file. Required for the proxy
      # to validate the IdP from inside the cluster (glibc resolves
      # *.localhost to 127.0.0.1, see setup.sh OIDC wiring).
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-gateway
        namespace: envoy-gateway-system
        sectionName: ou-https
      # specify the parent_refs for the kube-oidc-proxy
      kube_oidcproxy_parent_refs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-gateway
        namespace: envoy-gateway-system
        sectionName: kube-oidc-proxy


cert_template:
  ou: "Kubernetes"
  o: "MyOrg"
  l: "My Cluster"
  st: "State of Cluster"
  c: "MyCountry"



myvd_config_path: "WEB-INF/myvd.conf"
k8s_cluster_name: openunison-cp
enable_impersonation: true

impersonation:
  use_jetstack: true
  explicit_certificate_trust: true
  # Add or append the bind-address argument if your chart supports extraArgs
  extraArgs:
    - --bind-address=0.0.0.0

dashboard:
  namespace: "kubernetes-dashboard"
  cert_name: "kubernetes-dashboard-certs"
  label: "k8s-app=kubernetes-dashboard"
  service_name: kubernetes-dashboard
  require_session: true
  new: true

certs:
  use_k8s_cm: true

trusted_certs: []

monitoring:
  prometheus_service_account: system:serviceaccount:monitoring:prometheus-k8s

